[package]
name = "zap_stream_app"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = []

[dependencies]
tokio = { version = "1.40.0", features = ["fs", "rt-multi-thread", "rt", "macros"] }
egui = { version = "0.36.2", default-features = false, features = [] }
egui-wgpu = "0.36.2"
log = "0.4.25"
pretty_env_logger = "0.5.0"
bech32 = "0.11.0"
anyhow = "^1.0.91"
itertools = "0.14.0"
serde = { version = "1.0.214", features = ["derive"] }
directories = "6.0.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
qrcode = { version = "0.14", default-features = false }
lumina-video = { git = "https://github.com/v0l/lumina-video", branch = "egui-0.36" }

nostr = { version = "0.37.0", default-features = false, features = ["std", "nip49", "nip57"] }
nostrdb = { git = "https://github.com/damus-io/nostrdb-rs", rev = "e22e5632a75e" }
notedeck = { git = "https://github.com/damus-io/notedeck", rev = "93955445ae1853924b17c0973e3c037015dd19b0", package = "notedeck" }
enostr = { git = "https://github.com/damus-io/notedeck", rev = "93955445ae1853924b17c0973e3c037015dd19b0", package = "enostr" }
poll-promise = { version = "0.3.0", features = ["tokio"] }
ehttp = "0.5.0"
icu = "1.5.0"
icu_decimal = "1.5.0"
fixed_decimal = "0.5.6"
lnurl-rs = { version = "0.9.0", default-features = false }

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts"] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "android-game-activity", "default_fonts"] }
android_logger = "0.15.0"
android-activity = { version = "0.6", features = ["game-activity"] }

[patch.crates-io]
egui = { git = "https://github.com/damus-io/egui", rev = "c2c8f34fd3679475226ea67ab060f3324d3f2357" }
eframe = { git = "https://github.com/damus-io/egui", rev = "c2c8f34fd3679475226ea67ab060f3324d3f2357" }
egui-winit = { git = "https://github.com/damus-io/egui", rev = "c2c8f34fd3679475226ea67ab060f3324d3f2357" }
egui-wgpu = { git = "https://github.com/damus-io/egui", rev = "c2c8f34fd3679475226ea67ab060f3324d3f2357" }
egui_system_fonts = { git = "https://github.com/damus-io/egui", rev = "c2c8f34fd3679475226ea67ab060f3324d3f2357" }
egui_extras = { git = "https://github.com/damus-io/egui", rev = "c2c8f34fd3679475226ea67ab060f3324d3f2357" }
epaint = { git = "https://github.com/damus-io/egui", rev = "c2c8f34fd3679475226ea67ab060f3324d3f2357" }
winit = { git = "https://github.com/damus-io/winit", rev = "151a75954fe210a1792eb71a36f9bdae59cc6f4b" }
android-activity = { git = "https://github.com/damus-io/android-activity", rev = "642d4b05836f6cc12c3bd775bcf0d1b467e2014d" }

[patch."https://github.com/v0l/lumina-video"]
lumina-video = { path = "../lumina-video/crates/lumina-video" }
